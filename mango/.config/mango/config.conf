# ============================================================
# MangoWM config
# Docs: https://mangowm.github.io/docs
# ============================================================

# --- Monitor ---
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# --- Autostart ---
exec-once=waybar --config ~/.config/waybar/config.jsonc --style ~/.config/waybar/style.css
exec-once=swaybg -i ~/.config/mango/current-wallpaper -m fill
exec-once=mako
exec-once=hypridle
exec-once=hyprsunset
exec-once=/usr/lib/hyprpolkitagent
exec-once=wl-paste --type text  --watch cliphist store --max-items 1000
exec-once=wl-paste --type image --watch cliphist store --max-items 200
exec-once=bash ~/.config/mango/battery-watch.sh
exec-once=udiskie -a -n

# --- Variables de entorno ---
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mango
env=MOZ_ENABLE_WAYLAND,1
env=QT_QPA_PLATFORM,wayland
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=GDK_BACKEND,wayland,x11
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland

# --- Input / Teclado ---
xkb_rules_layout=us
repeat_rate=25
repeat_delay=300

# --- Scratchpad ---
scratchpad_width_ratio=0.85
scratchpad_height_ratio=0.6
windowrule=isnamedscratchpad:1,width:1600,height:650,appid:scratchpad

# --- Window rules ---
# kitty: terminal swallowing — kitty se reemplaza por la GUI que abras desde ella
windowrule=isterm:1,focused_opacity:0.98,unfocused_opacity:0.95,appid:kitty
# nemo: opacidad
windowrule=focused_opacity:0.95,unfocused_opacity:0.90,appid:nemo
# Popups comunes: auto-float
windowrule=isfloating:1,appid:^(pavucontrol|nm-connection-editor|org.gnome.Calculator|imv|mpv|vlc|eog)$
# File dialogs: auto-float
windowrule=isfloating:1,title:^(Open File|Save File|Save As)$
# Picture-in-Picture: overlay (siempre encima, sticky)
windowrule=isoverlay:1,isfloating:1,width:0.25,height:0.25,title:Picture-in-Picture

# --- Overview / Hot Corner ---
enable_hotarea=1
hotarea_corner=2
hotarea_size=10
overviewgappi=5
overviewgappo=30

# --- Apariencia ---
border_radius=10
no_radius_when_single=1
smartgaps=1
new_is_master=0
borderpx=2
focuscolor=0x509475ff
bordercolor=0x28322fff
urgentcolor=0xFF5345ff
gappih=6
gappiv=6
gappoh=8
gappov=8

# --- Sombras (solo en flotantes) ---
shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=5
shadows_position_x=0
shadows_position_y=2
shadowscolor=0x00000055

# --- Animaciones (CPU-only, sin GPU) ---
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
animation_duration_open=160
animation_duration_close=100
animation_duration_move=130
animation_duration_tag=130
animation_duration_focus=0

# --- Trackpad ---
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
disable_while_typing=1
drag_lock=0
click_method=1

# ============================================================
# KEYBINDINGS
# Sintaxis: bind=MODIFIERS,key,action,args
# Modificadores: SUPER, ALT, CTRL, SHIFT, NONE (combinar con +)
# ============================================================

# --- Sistema ---
bind=SUPER+SHIFT,l,spawn,swaylock
bind=SUPER+SHIFT,p,spawn,bash ~/.config/mango/power-menu.sh
bind=SUPER+SHIFT,f,spawn,bash ~/.config/mango/focus-mode.sh

# --- Launcher / Theme / Wallpaper ---
bind=SUPER,space,spawn,bash ~/.config/mango/launcher.sh
bind=SUPER,t,spawn,bash ~/.config/waybar/scripts/theme-switcher.sh menu
bind=SUPER,w,spawn,bash ~/.config/mango/wallpaper.sh

# --- Scratchpad terminal ---
bind=NONE,F12,toggle_named_scratchpad,scratchpad,none,kitty --class scratchpad

# --- Aplicaciones ---
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,firefox
bind=SUPER,c,spawn,bash -c "cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"
bind=SUPER,n,spawn,makoctl dismiss --all
bind=SUPER+SHIFT,n,spawn,bash -c 'mode=$(makoctl mode); if echo "$mode" | grep -q do-not-disturb; then makoctl mode -r do-not-disturb; notify-send -t 1500 "DND" "Off"; else makoctl mode -a do-not-disturb; notify-send -t 1500 "DND" "On"; fi'

# --- Layouts ---
bind=SUPER,Tab,spawn,bash ~/.config/mango/switch-layout.sh

# --- Gestión de ventanas ---
bind=SUPER,q,killclient
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,z,zoom,
bind=SUPER+SHIFT,s,spawn,bash ~/.config/mango/show-from-pool.sh
bind=SUPER,s,minimized,
bind=SUPER+SHIFT,q,quit
bind=SUPER,r,reload_config

# --- Foco ---
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down
bind=SUPER,grave,focuslast,

# --- Mover ventanas (swap) ---
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# --- Master / Stack ---
bind=SUPER+ALT,h,setmfact,-0.05
bind=SUPER+ALT,l,setmfact,+0.05
bind=SUPER+ALT,j,incnmaster,-1
bind=SUPER+ALT,k,incnmaster,+1

# --- Redimensionar ---
bind=SUPER+CTRL,left,resizewin,-40,+0
bind=SUPER+CTRL,right,resizewin,+40,+0
bind=SUPER+CTRL,up,resizewin,+0,-40
bind=SUPER+CTRL,down,resizewin,+0,+40

# --- Tags (view=cambiar, tag=mover ventana) ---
bind=SUPER,comma,viewtoleft,
bind=SUPER,period,viewtoright,
bind=SUPER+SHIFT,comma,tagtoleft,
bind=SUPER+SHIFT,period,tagtoright,
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0

# --- Screenshots (Print=clipboard, Ctrl+Print=guardar pantalla, Shift+Print=clipboard selección, Ctrl+Shift+Print=guardar selección) ---
bind=NONE,PRINT,spawn,bash ~/.config/mango/screenshot.sh full
bind=SHIFT,PRINT,spawn,bash ~/.config/mango/screenshot.sh sel
bind=CTRL,PRINT,spawn,bash ~/.config/mango/screenshot.sh full-save
bind=CTRL+SHIFT,PRINT,spawn,bash ~/.config/mango/screenshot.sh sel-save

# --- Multimedia ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# --- Mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
