[main]
font=FiraCode Nerd Font:size=11
icon-theme=Mojave-CT-Black
show-actions=yes
terminal=kitty
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=20
lines=1
prompt=" ❯ "
placeholder=Buscar aplicaciones...
dpi-aware=yes
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=000000ee
text=ffffffff
selection=0f0f0fff
selection-text=ffffffff
selection-match=cececeff
border=8d8d8daa
prompt=8d8d8dff
placeholder=5c5c5cff
input=ffffffff
match=cececeff
counter=9b9b9bff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=no           
