######################
# Catppuccin Mocha  #
######################
# Floating Pills for Tools & Time

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#111c18)\
$os\
[](bg:#1f2925 fg:#111c18)\
$directory\
$git_branch\
$git_status\
[](fg:#1f2925)\
$c\
$cmake\
$rust\
$golang\
$nodejs\
$php\
$python\
$java\
$kotlin\
$lua\
$ruby\
$zig\
$docker_context\
$kubernetes\
$terraform\
$cmd_duration\
$jobs\
$status\
\n$character"""

palette = 'osaka_jade'

[palettes.osaka_jade]
bg_dark   = '#111c18'
bg        = '#111c18'
bg_light  = '#1f2925'
bg_visual = '#343e3a'
fg        = '#C1C497'
fg_dim    = '#53685B'
fg_reverse = '#111c18'
red       = '#FF5345'
orange    = '#459451'
yellow    = '#E5C736'
green     = '#549e6a'
cyan      = '#2DD5B7'
blue      = '#509475'
violet    = '#D2689C'
magenta   = '#75bbb3'

[os]
disabled = false
style = "bg:#111c18 fg:#459451"
format = "[$symbol](bg:#111c18 fg:#459451)"

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Fedora = "󰣛 "
Gentoo = "󰣨 "
Linux = "󰌽 "
Macos = " "
Manjaro = " "
Mint = "󰣭 "
NixOS = " "
Raspbian = "󰐿 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
SUSE = " "
Ubuntu = "󰕈 "
Unknown = " "
Windows = "󰍲 "

[username]
show_always = true
style_user = "bg:#111c18 fg:#549e6a"
style_root = "bg:#111c18 fg:#FF5345 bold"
format = '[$user ](bg:#111c18 $style)'

[directory]
style = "fg:#C1C497 bg:#1f2925 bold"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:#FF5345 bg:#1f2925"

[directory.substitutions]
"/home/yeshua" = "󰇴"
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = " "
"Developer" = "󰲋 "
"Projects" = "󰉖 "
".config" = " "
"Desktop" = "󰚝 "

[git_branch]
symbol = " "
style = "bg:#1f2925 fg:#FF5345 bold"
format = '[$symbol$branch ]($style)'
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "bg:#1f2925 fg:#459451"
format = '[$all_status$ahead_behind ]($style)'
conflicted = "󰞇"
ahead = "󰜷${count}"
behind = "󰜮${count}"
diverged = "󰃻${ahead_count}󰃻${behind_count}"
untracked = "?"
stashed = "󰜦"
modified = "󱇨"
staged = "󰄬${count}"
renamed = "󰑕"
deleted = "󰍵"

# --- ESTILO DE BURBUJAS (FLOATING PILLS) ---
# Usamos un fondo #343e3a (bg_visual) para que resalten sobre la terminal

[c]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'

[cmake]
symbol = "△ "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'

[rust]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'

[golang]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'

[nodejs]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#549e6a)[](fg:#343e3a)'

[php]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#FF5345)[](fg:#343e3a)'

# --- PYTHON CONFIGURADO CON VENV ---
[python]
symbol = " "
# Aquí agregué (\($virtualenv\)) para que muestre el nombre del entorno
format = ' [](fg:#343e3a)[ $symbol$version( \($virtualenv\)) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'
detect_extensions = ['py']
detect_files = ['.python-version', 'Pipfile', '__pycache__', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini']

[java]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#FF5345)[](fg:#343e3a)'

[kotlin]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#FF5345)[](fg:#343e3a)'

[lua]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#549e6a)[](fg:#343e3a)'

[ruby]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#FF5345)[](fg:#343e3a)'

[zig]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol($version) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'

[docker_context]
symbol = " "
format = ' [](fg:#343e3a)[ $symbol$context ](bg:#343e3a fg:#549e6a)[](fg:#343e3a)'
only_with_files = true

[kubernetes]
symbol = "󱃾 "
format = ' [](fg:#343e3a)[ $symbol$context( \($namespace\)) ](bg:#343e3a fg:#459451)[](fg:#343e3a)'
disabled = false

[terraform]
symbol = "󱁢 "
format = ' [](fg:#343e3a)[ $symbol$workspace ](bg:#343e3a fg:#FF5345)[](fg:#343e3a)'

# --- TIEMPO DE COMANDO (CMD DURATION) ---
[cmd_duration]
min_time = 500
# Fondo gris azulado, texto amarillo, bordes redondos
format = " [](fg:#343e3a)[ 󱦟 $duration ](bg:#343e3a fg:#459451)[](fg:#343e3a)"
show_milliseconds = false

[jobs]
symbol = " "
number_threshold = 1
format = " [](fg:#343e3a)[ $symbol$number ](bg:#343e3a fg:#549e6a)[](fg:#343e3a)"

[status]
disabled = false
format = ' [](fg:#343e3a)[ $symbol$status ](bg:#343e3a fg:#FF5345 bold)[](fg:#343e3a)'
symbol = "✗ "
success_symbol = ""
not_executable_symbol = "󰌋 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰂭 "
signal_symbol = "󱐋 "

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:#549e6a)"
error_symbol = "[❯](bold fg:#FF5345)"
vimcmd_symbol = "[❮](bold fg:#549e6a)"
vimcmd_visual_symbol = "[❮](bold fg:#FF5345)"
vimcmd_replace_symbol = "[❮](bold fg:#459451)"
vimcmd_replace_one_symbol = "[❮](bold fg:#459451)"
