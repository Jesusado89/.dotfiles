######################
# Catppuccin Mocha  #
######################
# Floating Pills for Tools & Time

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#0B0C16)\
$os\
[](bg:#191a23 fg:#0B0C16)\
$directory\
$git_branch\
$git_status\
[](fg:#191a23)\
$c\
$cmake\
$rust\
$golang\
$nodejs\
$php\
$python\
$java\
$kotlin\
$lua\
$ruby\
$zig\
$docker_context\
$kubernetes\
$terraform\
$cmd_duration\
$jobs\
$status\
\n$character"""

palette = 'hackerman'

[palettes.hackerman]
bg_dark   = '#0B0C16'
bg        = '#0B0C16'
bg_light  = '#191a23'
bg_visual = '#2f3038'
fg        = '#ddf7ff'
fg_dim    = '#6a6e95'
fg_reverse = '#0B0C16'
red       = '#50f872'
orange    = '#50f7d4'
yellow    = '#a4ffec'
green     = '#4fe88f'
cyan      = '#7cf8f7'
blue      = '#829dd4'
violet    = '#86a7df'
magenta   = '#cddbf4'

[os]
disabled = false
style = "bg:#0B0C16 fg:#50f7d4"
format = "[$symbol](bg:#0B0C16 fg:#50f7d4)"

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Fedora = "󰣛 "
Gentoo = "󰣨 "
Linux = "󰌽 "
Macos = " "
Manjaro = " "
Mint = "󰣭 "
NixOS = " "
Raspbian = "󰐿 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
SUSE = " "
Ubuntu = "󰕈 "
Unknown = " "
Windows = "󰍲 "

[username]
show_always = true
style_user = "bg:#0B0C16 fg:#4fe88f"
style_root = "bg:#0B0C16 fg:#50f872 bold"
format = '[$user ](bg:#0B0C16 $style)'

[directory]
style = "fg:#ddf7ff bg:#191a23 bold"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:#50f872 bg:#191a23"

[directory.substitutions]
"/home/yeshua" = "󰇴"
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = " "
"Developer" = "󰲋 "
"Projects" = "󰉖 "
".config" = " "
"Desktop" = "󰚝 "

[git_branch]
symbol = " "
style = "bg:#191a23 fg:#86a7df bold"
format = '[$symbol$branch ]($style)'
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "bg:#191a23 fg:#50f7d4"
format = '[$all_status$ahead_behind ]($style)'
conflicted = "󰞇"
ahead = "󰜷${count}"
behind = "󰜮${count}"
diverged = "󰃻${ahead_count}󰃻${behind_count}"
untracked = "?"
stashed = "󰜦"
modified = "󱇨"
staged = "󰄬${count}"
renamed = "󰑕"
deleted = "󰍵"

# --- ESTILO DE BURBUJAS (FLOATING PILLS) ---
# Usamos un fondo #2f3038 (bg_visual) para que resalten sobre la terminal

[c]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'

[cmake]
symbol = "△ "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'

[rust]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'

[golang]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'

[nodejs]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#4fe88f)[](fg:#2f3038)'

[php]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#86a7df)[](fg:#2f3038)'

# --- PYTHON CONFIGURADO CON VENV ---
[python]
symbol = " "
# Aquí agregué (\($virtualenv\)) para que muestre el nombre del entorno
format = ' [](fg:#2f3038)[ $symbol$version( \($virtualenv\)) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'
detect_extensions = ['py']
detect_files = ['.python-version', 'Pipfile', '__pycache__', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini']

[java]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f872)[](fg:#2f3038)'

[kotlin]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#86a7df)[](fg:#2f3038)'

[lua]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#4fe88f)[](fg:#2f3038)'

[ruby]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f872)[](fg:#2f3038)'

[zig]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol($version) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'

[docker_context]
symbol = " "
format = ' [](fg:#2f3038)[ $symbol$context ](bg:#2f3038 fg:#4fe88f)[](fg:#2f3038)'
only_with_files = true

[kubernetes]
symbol = "󱃾 "
format = ' [](fg:#2f3038)[ $symbol$context( \($namespace\)) ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)'
disabled = false

[terraform]
symbol = "󱁢 "
format = ' [](fg:#2f3038)[ $symbol$workspace ](bg:#2f3038 fg:#86a7df)[](fg:#2f3038)'

# --- TIEMPO DE COMANDO (CMD DURATION) ---
[cmd_duration]
min_time = 500
# Fondo gris azulado, texto amarillo, bordes redondos
format = " [](fg:#2f3038)[ 󱦟 $duration ](bg:#2f3038 fg:#50f7d4)[](fg:#2f3038)"
show_milliseconds = false

[jobs]
symbol = " "
number_threshold = 1
format = " [](fg:#2f3038)[ $symbol$number ](bg:#2f3038 fg:#4fe88f)[](fg:#2f3038)"

[status]
disabled = false
format = ' [](fg:#2f3038)[ $symbol$status ](bg:#2f3038 fg:#50f872 bold)[](fg:#2f3038)'
symbol = "✗ "
success_symbol = ""
not_executable_symbol = "󰌋 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰂭 "
signal_symbol = "󱐋 "

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:#4fe88f)"
error_symbol = "[❯](bold fg:#50f872)"
vimcmd_symbol = "[❮](bold fg:#4fe88f)"
vimcmd_visual_symbol = "[❮](bold fg:#86a7df)"
vimcmd_replace_symbol = "[❮](bold fg:#50f7d4)"
vimcmd_replace_one_symbol = "[❮](bold fg:#50f7d4)"
